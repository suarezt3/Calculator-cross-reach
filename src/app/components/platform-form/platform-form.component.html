<div class="form-container">
  <h2>Ingreso de Datos</h2>

  <!-- Inputs de País y Universo -->
  <div class="form-row">
    <div class="form-group">
      <label for="country">País</label>
      <select
        id="country"
        [(ngModel)]="country"
        class="form-select"
      >
        <option value="" disabled>Selecciona un país</option>
        @for (c of availableCountries(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="universe">Universo</label>
      <input
        type="text"
        id="universe"
        [value]="universe() ? formatNumber(universe()) : ''"
        (input)="onUniverseInput($event)"
        placeholder="Ej: 27.000.000"
        class="form-input number-input"
      />
    </div>
  </div>

  <!-- Plataformas agregadas -->
  <div class="platforms-section">
    <h3>Plataformas</h3>

    <div class="platforms-grid">
      @for (platform of platforms(); track platform.platformName) {
        <div
          class="platform-card"
          [style.background-color]="platformColors[platform.platformName] || '#e0e0e0'"
        >
          <div class="platform-header">
            <!-- Icono de la plataforma -->
            <div class="platform-icon-wrapper">
              <app-platform-icon [platformName]="platform.platformName"></app-platform-icon>
            </div>
            <button
              type="button"
              (click)="removePlatform(platform.platformName)"
              class="btn-remove"
              title="Eliminar plataforma"
            >
              🗑️
            </button>
          </div>

          <div class="platform-input">
            <label>Reach</label>
            <input
              type="text"
              [value]="platform.reach ? formatNumber(platform.reach) : ''"
              (input)="onReachInput(platform.platformName, $event)"
              placeholder="0"
              class="number-input"
            />
          </div>
        </div>
      }
    </div>

    <!-- Botón para agregar plataforma -->
    <button
      type="button"
      (click)="openPlatformSelector()"
      class="btn-add-platform"
    >
      + Agregar Plataforma
    </button>
  </div>

  <!-- Botón agregar a tabla -->
  <div class="form-actions">
    <button
      type="button"
      (click)="submitForm()"
      class="btn-submit"
    >
      Agregar a la Tabla
    </button>
  </div>
</div>

<!-- Modal Selector de Plataformas -->
@if (showPlatformSelector()) {
  <div class="modal-overlay" (click)="showPlatformSelector.set(false)">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>Selecciona una Plataforma</h3>

      <div class="platform-list">
        @for (platform of availablePlatforms(); track platform) {
          <button
            type="button"
            (click)="addPlatform(platform)"
            class="platform-option"
            [style.border-left-color]="platformColors[platform] || '#333'"
          >
            <div class="platform-option-icon">
              <app-platform-icon [platformName]="platform"></app-platform-icon>
            </div>
            <span>{{ platform }}</span>
          </button>
        } @empty {
          <p class="no-platforms">No hay plataformas disponibles</p>
        }
      </div>

      <button
        type="button"
        (click)="showPlatformSelector.set(false)"
        class="btn-cancel"
      >
        ✗ Cancelar
      </button>
    </div>
  </div>
}
