<div class="app-container">
  <header class="app-header">
    <h1>{{ title }}</h1>
    <p class="subtitle">Calculadora de Cross Reach - Fórmula de Sainsbury</p>
  </header>

  <main class="app-main">
    <app-platform-form
      [usedCountries]="usedCountries"
      (addToTable)="handleAddToTable($event)"
    />

    <app-results-table
      [data]="displayData"
      (editRow)="handleEditRow($event)"
      (deleteRow)="handleDeleteRow($event)"
    />
  </main>

  <footer class="app-footer">
    <p>© 2024 Cross Reach Calculator</p>
  </footer>
</div>
